<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7Souls | Home</title>
<link rel="icon" href="./assets/deltarune-save.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-start: #0e0c14;
    --bg-end: #0b1730;
    --soul-red: #ff3b5c;
    --dt-cyan: #5ee0e0;
    --text: #e8e4f0;
    --text-dim: #8f8aa3;
    --border: #2c2738;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Space Grotesk',sans-serif;
    color:var(--text);
    background:var(--bg-start);
    transition:background-color .6s ease;
    min-height:100vh;
    overflow-x:hidden;
  }
  body.scrolled{background:var(--bg-end);}
  .mono{font-family:'JetBrains Mono',monospace;}

  /* twinkling stars */
  .stars{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      radial-gradient(1.5px 1.5px at 15% 20%, rgba(255,255,255,.6), transparent),
      radial-gradient(1.5px 1.5px at 35% 65%, rgba(255,255,255,.4), transparent),
      radial-gradient(2px 2px at 60% 30%, rgba(94,224,224,.5), transparent),
      radial-gradient(1.5px 1.5px at 80% 75%, rgba(255,255,255,.45), transparent),
      radial-gradient(1.5px 1.5px at 90% 15%, rgba(255,59,92,.4), transparent),
      radial-gradient(1.5px 1.5px at 25% 90%, rgba(255,255,255,.35), transparent),
      radial-gradient(1.5px 1.5px at 50% 50%, rgba(255,255,255,.3), transparent);
    background-size: 100% 100%;
    animation: twinkle 4s ease-in-out infinite alternate;
  }
  @keyframes twinkle{
    from{opacity:.55;}
    to{opacity:1;}
  }

  nav{
    position:sticky;top:0;z-index:10;
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 6vw;
    background:rgba(10,9,16,0.55);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  nav .logo{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;}
  nav .logo img{width:28px;height:28px;object-fit:cover;border-radius:4px;}
  nav .logo .n{color:var(--dt-cyan);}

  main{position:relative;z-index:1;}

  .hero{
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:60px 6vw;position:relative;
  }
  .hero h1{
    font-size:clamp(30px,6vw,54px);font-weight:700;letter-spacing:-0.5px;
    opacity:0;transform:translateY(16px);
    animation:rise .8s ease forwards .15s;
  }
  .hero .subtitle{
    max-width:560px;margin:24px auto 0;color:var(--text-dim);
    font-size:16px;line-height:1.75;
    opacity:0;transform:translateY(16px);
    animation:rise .8s ease forwards .35s;
  }
  .hero .subtitle strong{color:var(--text);font-weight:600;}
  .star-img{
    width:52px;height:52px;object-fit:cover;margin-bottom:24px;
    filter:drop-shadow(0 0 14px rgba(255,215,120,0.5));
    opacity:0;
    animation:rise .8s ease forwards 0s;
  }
  @keyframes rise{
    to{opacity:1;transform:translateY(0);}
  }

  .hero .actions{
    margin-top:34px;
    opacity:0;transform:translateY(16px);
    animation:rise .8s ease forwards .55s;
  }
  .btn{
    padding:13px 30px;border-radius:4px;font-weight:600;font-size:14.5px;
    text-decoration:none;display:inline-block;transition:all .2s;
    background:var(--soul-red);color:#fff;
    box-shadow:0 0 0 rgba(255,59,92,0);
  }
  .btn:hover{
    box-shadow:0 0 22px rgba(255,59,92,.5);
    transform:translateY(-2px);
  }

  .scroll-hint{
    position:fixed;bottom:36px;left:0;width:100%;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    color:var(--text-dim);font-size:9.5px;letter-spacing:1px;
    white-space:nowrap;
    text-align:center;
    opacity:0;animation:rise .8s ease forwards .75s;
  }
  .scroll-hint .chevron{
    width:8px;height:8px;border-right:2px solid var(--text-dim);border-bottom:2px solid var(--text-dim);
    transform:rotate(45deg);
  }

  @media(max-width:640px){
    .hero{padding:50px 8vw;}
  }
</style>
</head>
<body>
<div class="stars"></div>

<nav>
  <div class="logo">
    <img src="./assets/deltarune-save.png" alt="7Souls">
    <span><span class="n">7</span>Souls</span>
  </div>
</nav>

<main>
  <section class="hero">
    <img class="star-img" src="./assets/undertale-save.png" alt="star">
    <h1>Clan 𝟽𝚂𝚘𝚞𝚕𝚜</h1>
    <p class="subtitle">
      Komunitas Yang Bertema Undertale / Deltarune<br>
      <strong>Clan Iseng Ini Dibuat Untuk Kalian Para Editor / Gamer</strong>
    </p>
    <div class="actions">
      <a href="https://clan.the7souls.my.id/join" class="btn">Gabung Grub</a>
    </div>
    <div class="scroll-hint">
      <span>SCROLL UNTUK MENCARI TAHU LEBIH LANJUT</span>
      <span class="chevron"></span>
    </div>
  </section>
</main>

<script>
  window.addEventListener('scroll', () => {
    if (window.scrollY > 40) {
      document.body.classList.add('scrolled');
    } else {
      document.body.classList.remove('scrolled');
    }
  });
</script>

</body>
</html>
